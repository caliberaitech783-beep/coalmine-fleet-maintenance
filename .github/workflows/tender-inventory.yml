name: Tender Azure infrastructure inventory
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Login with existing Azure deployment identity
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8EC4CD9D1EEF4C5FBC24D96A16BD3880 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1D33A1D8AAEB4638B2DA49BF9F257B08 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1CF007C6A6C04A10855D16EB25E5D816 }}
      - name: Inspect existing hosting resources
        run: |
          az resource list -g coalmine-fleet-maintenance-rg --query '[].{name:name,type:type,location:location,id:id}' -o json
          az webapp show -g coalmine-fleet-maintenance-rg -n coalmine-fleet-azure-783 --query '{plan:serverFarmId,location:location,kind:kind,subnet:virtualNetworkSubnetId,outbound:outboundIpAddresses}' -o json
          az postgres flexible-server show -g coalmine-fleet-maintenance-rg -n coalmine-fleet-pg-783 --query '{version:version,state:state,network:network,backup:backup,location:location,administrator:administratorLogin}' -o json
          az afd profile show -g coalmine-fleet-maintenance-rg --profile-name coalmine-afd-783 --query '{id:id,frontDoorId:frontDoorId,sku:sku}' -o json
