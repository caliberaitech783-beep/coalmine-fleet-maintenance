name: BDMS coordinated production release

on:
  push:
    branches: [azure-hosting-1.0]
  pull_request:
    branches: [azure-hosting-1.0]
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Run checks and build without changing Azure"
        type: boolean
        default: true
      force_deploy:
        description: "Explicitly stage the current production-branch revision even with no runtime delta"
        type: boolean
        default: false
      report_source_sha:
        description: "Optional immutable report-only revision already merged into the production branch"
        required: false
        type: string

permissions:
  contents: read

env:
  AZURE_RESOURCE_GROUP: coalmine-fleet-maintenance-rg
  AZURE_WEBAPP_NAME: coalmine-fleet-azure-783
  AZURE_FRONT_DOOR_PROFILE: coalmine-afd-783
  LIVE_URL: https://bdms.cmll.in

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: session_test
          POSTGRES_PASSWORD: session_test
          POSTGRES_DB: session_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U session_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    outputs:
      source_sha: ${{ steps.plan.outputs.target }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.report_source_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
      - name: Classify the complete delta from healthy live production
        id: plan
        env:
          REPORT_SOURCE_SHA: ${{ inputs.report_source_sha }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: node .github/scripts/release-plan.mjs
      - name: Install and run all checks with an isolated test database
        env:
          AUTH_SESSION_TEST_DATABASE_URL: postgresql://session_test:session_test@localhost:5432/session_test
          AUTH_SESSION_TEST_DATABASE_SSL: "false"
        run: |
          npm ci
          npm test
      - name: Build once and package the exact checked revision
        if: steps.plan.outputs.mode != 'none'
        env:
          APP_VERSION_SOURCE: ${{ steps.plan.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          printf '%s' "$APP_VERSION_SOURCE" > DEPLOYMENT_SHA
          node .github/scripts/package-runtime.mjs "$RUNNER_TEMP/node-app.zip"
      - name: Smoke-test the packaged application against the isolated database
        if: steps.plan.outputs.mode != 'none'
        env:
          EXPECTED_SHA: ${{ steps.plan.outputs.target }}
          DATABASE_URL: postgresql://session_test:session_test@localhost:5432/session_test
          PGSSLMODE: disable
          DISABLE_SCHEDULED_JOBS: "true"
          PORT: "3137"
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/package-smoke"
          unzip -q "$RUNNER_TEMP/node-app.zip" -d "$RUNNER_TEMP/package-smoke"
          cd "$RUNNER_TEMP/package-smoke"
          node server.mjs > "$RUNNER_TEMP/package-smoke.log" 2>&1 &
          smoke_pid=$!
          trap 'kill "$smoke_pid" 2>/dev/null || true' EXIT
          if ! bash "$GITHUB_WORKSPACE/.github/scripts/verify-release.sh" http://127.0.0.1:3137 "$EXPECTED_SHA" false 12; then
            cat "$RUNNER_TEMP/package-smoke.log"
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        if: steps.plan.outputs.mode != 'none'
        with:
          name: bdms-release-${{ steps.plan.outputs.target }}
          path: ${{ runner.temp }}/node-app.zip
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  deploy:
    name: Publish latest tested release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/azure-hosting-1.0' && needs.build.outputs.mode != 'none' && inputs.validate_only != true
    needs: build
    runs-on: ubuntu-latest
    # Builds stay parallel; all staging/production writers share this lock.
    concurrency:
      group: coalmine-fleet-production
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DEPLOY_SHA: ${{ needs.build.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - name: Recheck live state and branch head after waiting for the lock
        id: release
        env:
          REPORT_SOURCE_SHA: ${{ inputs.report_source_sha }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: node .github/scripts/release-plan.mjs
      - name: Locate the actual healthy live package for UI rollback
        id: rollback
        if: steps.release.outputs.mode == 'ui'
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_SHA: ${{ steps.release.outputs.live }}
        run: node .github/scripts/rollback-artifact.mjs
      - name: Select safe deployment lane
        id: lane
        env:
          RELEASE_MODE: ${{ steps.release.outputs.mode }}
          ROLLBACK_MODE: ${{ steps.rollback.outputs.mode }}
          BASELINE_SHA: ${{ steps.release.outputs.live }}
        shell: bash
        run: |
          set -euo pipefail
          mode="$RELEASE_MODE"
          if [ "$mode" = "ui" ] && [ "$ROLLBACK_MODE" != "ui" ]; then mode=backend; fi
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'PREVIOUS_SHA=%s\n' "$BASELINE_SHA" >> "$GITHUB_ENV"
          printf '### Deployment lane\n\n%s\n\n' "$mode" >> "$GITHUB_STEP_SUMMARY"
      - name: Download the checked application package
        if: steps.release.outputs.mode != 'none'
        uses: actions/download-artifact@v8
        with:
          name: bdms-release-${{ needs.build.outputs.source_sha }}
          path: packages/current
          digest-mismatch: error
      - name: Download the retained healthy production package
        if: steps.lane.outputs.mode == 'ui'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.rollback.outputs.artifact_id }}
          run-id: ${{ steps.rollback.outputs.run_id }}
          github-token: ${{ github.token }}
          path: packages/rollback
          digest-mismatch: error
      - name: Verify package identities before Azure access
        if: steps.release.outputs.mode != 'none'
        env:
          DEPLOY_MODE: ${{ steps.lane.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(unzip -p packages/current/node-app.zip DEPLOYMENT_SHA)" = "$DEPLOY_SHA"
          if [ "$DEPLOY_MODE" = "ui" ]; then
            rollback_path=packages/rollback/node-app.zip
            if [ ! -f "$rollback_path" ]; then rollback_path=packages/rollback/current-package.zip; fi
            test -f "$rollback_path"
            test "$(unzip -p "$rollback_path" DEPLOYMENT_SHA)" = "$PREVIOUS_SHA"
            printf 'ROLLBACK_PACKAGE=%s\n' "$rollback_path" >> "$GITHUB_ENV"
          fi
      - name: Login to Azure
        id: azure
        if: steps.release.outputs.mode != 'none'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8EC4CD9D1EEF4C5FBC24D96A16BD3880 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1D33A1D8AAEB4638B2DA49BF9F257B08 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1CF007C6A6C04A10855D16EB25E5D816 }}
      - name: Confirm the UI baseline immediately before publishing
        if: steps.lane.outputs.mode == 'ui'
        run: |
          node --input-type=module -e 'import {readHealthyLive} from "./.github/scripts/release-plan.mjs";if(await readHealthyLive(process.env.LIVE_URL)!==process.env.PREVIOUS_SHA)throw new Error("Production changed; refusing to replace newer changes.");'
      - name: Publish and verify UI package
        id: ui
        if: steps.lane.outputs.mode == 'ui'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --src-path packages/current/node-app.zip --type zip --clean true --restart true || echo "Checking the actual deployment outcome"
          bash .github/scripts/verify-release.sh "$LIVE_URL" "$DEPLOY_SHA" true
      - name: Restore the actual previous healthy UI package on failure
        if: always() && steps.ui.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --src-path "$ROLLBACK_PACKAGE" --type zip --clean true --restart true || echo "Checking the actual rollback outcome"
          bash .github/scripts/verify-release.sh "$LIVE_URL" "$PREVIOUS_SHA" true
          echo "Previous production package restored and healthy"
      - name: Mark unsuccessful UI release
        if: always() && steps.ui.outcome == 'failure'
        run: exit 1

      - name: Start staging slot and discover its URL
        id: staging_start
        if: steps.lane.outputs.mode == 'backend'
        shell: bash
        run: |
          az webapp start --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --slot staging
          staging_host="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --slot staging --query defaultHostName -o tsv)"
          test -n "$staging_host"
          printf 'STAGING_URL=https://%s\n' "$staging_host" >> "$GITHUB_ENV"

      - name: Deploy to Azure staging slot
        if: steps.lane.outputs.mode == 'backend'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if az webapp deploy \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --slot staging \
              --src-path packages/current/node-app.zip \
              --type zip \
              --clean true \
              --restart true; then
              exit 0
            fi
            # OneDeploy can finish successfully after the Azure CLI has already
            # returned a non-zero polling result. Only accept that case when the
            # slot itself proves that the exact commit is healthy and isolated.
            for health_attempt in {1..12}; do
              if response="$(curl --fail --silent --show-error --max-time 20 "${STAGING_URL}/api/health?deploy-recovery=${DEPLOY_SHA}")" && \
                HEALTH_RESPONSE="$response" EXPECTED_COMMIT="$DEPLOY_SHA" node -e "const h=JSON.parse(process.env.HEALTH_RESPONSE); if(h.status!=='ok'||h.database!=='connected'||h.commit!==process.env.EXPECTED_COMMIT||h.scheduledJobsEnabled!==false) process.exit(1)"; then
                echo "Azure CLI reported a deployment error, but staging verified the exact commit: ${response}"
                exit 0
              fi
              sleep 5
            done
            if [ "$attempt" -eq 3 ]; then
              echo "Staging ZIP deployment failed after ${attempt} attempts"
              exit 1
            fi
            echo "Staging ZIP deployment attempt ${attempt} failed; restarting the slot before retry"
            az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --slot staging || true
            sleep 20
          done

      - name: Verify staging without a redundant restart
        if: steps.lane.outputs.mode == 'backend'
        shell: bash
        run: |
          for attempt in {1..24}; do
            if response="$(curl --fail --silent --show-error --max-time 20 "${STAGING_URL}/api/health?deployment=${DEPLOY_SHA}")" && \
              HEALTH_RESPONSE="$response" EXPECTED_COMMIT="$DEPLOY_SHA" node -e "const h=JSON.parse(process.env.HEALTH_RESPONSE); if(h.status!=='ok'||h.database!=='connected'||h.commit!==process.env.EXPECTED_COMMIT||h.scheduledJobsEnabled!==false) process.exit(1)"; then
              echo "Staging verified at ${DEPLOY_SHA}: ${response}"
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Staging verification failed"
              exit 1
            fi
            sleep 5
          done

      - name: Swap staging into production with automatic rollback
        if: steps.lane.outputs.mode == 'backend'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'import {readHealthyLive} from "./.github/scripts/release-plan.mjs";if(await readHealthyLive(process.env.LIVE_URL)!==process.env.PREVIOUS_SHA)throw new Error("Production changed; refusing to replace newer changes.");'
          az webapp deployment slot swap --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --slot staging --target-slot production || echo "Checking the actual swap outcome"
          if bash .github/scripts/verify-release.sh "$LIVE_URL" "$DEPLOY_SHA" true; then exit 0; fi
          if bash .github/scripts/verify-release.sh "$LIVE_URL" "$PREVIOUS_SHA" true 1; then
            echo "Previous production remains healthy; no rollback swap needed."
            exit 1
          fi
          echo "Production verification failed; restoring the previous production package"
          bash .github/scripts/verify-release.sh "$STAGING_URL" "$PREVIOUS_SHA" false 3
          az webapp deployment slot swap --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --slot staging --target-slot production || echo "Checking the actual rollback outcome"
          bash .github/scripts/verify-release.sh "$LIVE_URL" "$PREVIOUS_SHA" true
          echo "Previous production package restored and healthy"
          exit 1

      - name: Enforce Front Door-only production origin
        if: always() && steps.azure.outcome == 'success' && steps.release.outputs.mode != 'none'
        shell: bash
        run: |
          set -euo pipefail
          frontdoor_id="$(az afd profile show --resource-group "$AZURE_RESOURCE_GROUP" --profile-name "$AZURE_FRONT_DOOR_PROFILE" --query frontDoorId -o tsv)"
          origin_host="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query defaultHostName -o tsv)"
          test -n "$frontdoor_id"
          test -n "$origin_host"

          existing_rule="$(az webapp config access-restriction show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query "ipSecurityRestrictions[?name=='Allow-Coal-FrontDoor'] | [0]" -o json)"
          rule_matches="$(RULE_JSON="$existing_rule" EXPECTED_FDID="$frontdoor_id" node -e 'const r=JSON.parse(process.env.RULE_JSON||"null");const id=process.env.EXPECTED_FDID;process.stdout.write(String(r?.name==="Allow-Coal-FrontDoor"&&r?.action==="Allow"&&r?.priority===100&&r?.ipAddress==="AzureFrontDoor.Backend"&&r?.headers?.["x-azure-fdid"]?.includes(id)));')"

          if [ "$rule_matches" != "true" ]; then
            if [ "$(az webapp config access-restriction show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query "ipSecurityRestrictions[?name=='Allow-Coal-FrontDoor'].name | [0]" -o tsv)" = "Allow-Coal-FrontDoor" ]; then
              az webapp config access-restriction remove --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --rule-name Allow-Coal-FrontDoor
            fi
            az webapp config access-restriction add \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --rule-name Allow-Coal-FrontDoor \
              --action Allow \
              --priority 100 \
              --service-tag AzureFrontDoor.Backend \
              --http-header "x-azure-fdid=${frontdoor_id}"
          fi

          for attempt in {1..12}; do
            live_response="$(curl --fail --silent --show-error --max-time 20 "${LIVE_URL}/api/health?origin-lock=${DEPLOY_SHA}")" || true
            origin_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "https://${origin_host}/api/health" || true)"
            if HEALTH_RESPONSE="$live_response" node -e 'const h=JSON.parse(process.env.HEALTH_RESPONSE);if(h.status!=="ok"||h.database!=="connected"||h.scheduledJobsEnabled!==true)process.exit(1)' && [ "$origin_status" = "403" ]; then
              echo "Front Door-only production origin verified; direct origin returned ${origin_status}"
              exit 0
            fi
            sleep 5
          done
          echo "Front Door-only production origin verification failed"
          exit 1

      - name: Stop staging slot
        if: always() && steps.staging_start.outcome == 'success'
        run: az webapp stop --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --slot staging

      - name: Logout from Azure
        if: always() && steps.azure.outcome == 'success'
        run: az logout
