name: Daily Full Backup collector dispatcher
on:
  schedule:
    # 04:00 IST. GitHub schedules execute only from the default branch.
    - cron: '30 22 * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'full-recovery-backup.yml',
              ref: 'azure-hosting-1.0',
              inputs: {create_full_backup: false}
            });
