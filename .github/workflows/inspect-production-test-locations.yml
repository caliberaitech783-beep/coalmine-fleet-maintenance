name: Remove confirmed test records with encrypted recovery copy

on:
  push:
    branches: [azure-hosting-1.0]
    paths: [.github/workflows/inspect-production-test-locations.yml]

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false esbuild@0.28.2
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8EC4CD9D1EEF4C5FBC24D96A16BD3880 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1D33A1D8AAEB4638B2DA49BF9F257B08 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1CF007C6A6C04A10855D16EB25E5D816 }}
      - name: Archive and remove confirmed test records, then verify live locations
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import {execFileSync} from 'node:child_process';
          import {createCipheriv,publicEncrypt,randomBytes} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          import {build} from 'esbuild';
          const publicKey = `-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAjqwmsVTocI0CbWmGra5H
          FRNbL5gAn2SeE8sfythno0e3JwdDQqq0u50dXoyXfm6qByFQMCy2A3Bv2DF0vwdb
          RTruQVCSBvlHkUamWWPDrNsSKywgzC04ae6zL2vDknq2Ai/UPw3idC6gSedVKvzo
          VMTyBL6hClViM7nc18y2NYp+DvBwcvHlM/j954KCYlncY6TsfvlccVGGFM3bRuvC
          gGHHt7Tu2lFRmGtyZz1204+GU2Qx5hZhJe0rVFOCiTao3M6lXk+U/ZnUm05ag1v5
          TiPpqUFYt/qI9LzM8Nbop3rYulXoT3wZABTnFGMa43TvG1tJL3DlvEsBgFXB3DCi
          st0YbNQEX0Gt6TPePRDMDgj9txK+Lz8/3imMIRBcCCCGlB9scPXbzykCYnvK++E3
          iedC9Hmxlnvd4JuZSdfEQVnJBIyNOqRffCkQ1E0azwSbe1WS+QW4A7d6WtScaCAB
          etNzN0Xh5ETu/8S+k6DkOpu5DnLj0rx1eHW12WHQihqvAgMBAAE=
          -----END PUBLIC KEY-----`;
          async function inspectDatabase() {
            const connectionString=process.env.DATABASE_URL||process.env.APPSETTING_DATABASE_URL;
            if(!connectionString)throw new Error('Database configuration unavailable');
            const pool=new pg.Pool({connectionString,ssl:{rejectUnauthorized:false},connectionTimeoutMillis:15000,max:1});
            const client=await pool.connect();
            try {
            await client.query('BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY');
            const report={capturedAt:new Date().toISOString()};
            report.sites=(await client.query(`SELECT site,count(*)::int AS requests,count(*) FILTER (WHERE verified_at IS NULL)::int AS unverified FROM maintenance_requests GROUP BY site ORDER BY site`)).rows;
            report.masterTypes=(await client.query('SELECT master_name,count(*)::int AS records FROM master_records GROUP BY master_name ORDER BY master_name')).rows;
            report.locationMasters=(await client.query("SELECT id,master_name,record_data,created_at FROM master_records WHERE master_name ~* '(site|location|region)' ORDER BY id")).rows;
            report.candidateMasters=(await client.query("SELECT id,master_name,record_data-'passwordHash'-'password'-'temporaryPassword' AS record_data,created_at FROM master_records WHERE record_data::text ~* '(qa[ _-]*bdms|dummy|synthetic|(^|[ _-])test[ _-]|audit[ _-])' ORDER BY id LIMIT 500")).rows;
            report.candidateRequests=(await client.query("SELECT reference,site,door_number,equipment_name,chassis_number,registration_number,complaint,owner_name,requester_login,status,started_at,created_at,verified_at FROM maintenance_requests WHERE concat_ws(' ',site,reference,door_number,equipment_name,complaint) ~* '(^|[ _-])(qa|test|dummy|demo|synthetic|audit)([ _-]|$)' ORDER BY created_at LIMIT 500")).rows;
            report.originEvents=(await client.query("SELECT id,actor_login,actor_name,module,action,target_reference,reason,changed_fields,occurred_at FROM audit_events WHERE changed_fields::text ~* 'qa[ _-]*bdms|9F27B4C1' OR target_reference=ANY($1::text[]) ORDER BY occurred_at LIMIT 100",[report.candidateRequests.map(row=>row.reference)])).rows;
            report.testMasters=(await client.query("SELECT * FROM master_records WHERE concat_ws(' ',record_data->>'site',record_data->>'location',record_data->>'currentLocation',record_data->>'login',record_data->>'employee',record_data->>'door',record_data->>'equipmentName',record_data->>'itemName',record_data->>'qaRun',record_data->>'region',record_data->>'oem') ~* '(^|[ _-])(qa|test|dummy|demo|synthetic)([ _-]|$)' ORDER BY id")).rows;
            const logins=report.testMasters.filter(row=>row.master_name==='Users & employees').map(row=>String(row.record_data.login||'').toLowerCase());
            report.linkedRequests=(await client.query('SELECT * FROM maintenance_requests WHERE lower(requester_login)=ANY($1::text[]) OR reference=ANY($2::text[]) ORDER BY created_at',[logins,report.candidateRequests.map(row=>row.reference)])).rows;
            report.testTickets=(await client.query("SELECT * FROM crm_tickets WHERE lower(creator_login)=ANY($1::text[]) OR site ~* '(^|[ _-])(qa|test|dummy|demo|synthetic)([ _-]|$)' ORDER BY id",[logins])).rows;
            report.masterLocations=(await client.query("SELECT record_data->>'site' AS site,record_data->>'location' AS location,record_data->>'currentLocation' AS current_location,count(*)::int AS records FROM master_records WHERE master_name='Equipment master' GROUP BY 1,2,3 ORDER BY 1,2,3")).rows;
            report.referenceColumns=(await client.query("SELECT table_name,column_name FROM information_schema.columns WHERE table_schema='public' AND (column_name IN ('request_reference','ticket_reference','login_name','recipient_login','master_record_id') OR column_name LIKE '%site%') ORDER BY table_name,column_name")).rows;
            await client.query('ROLLBACK');
            return report;
            } finally {client.release();await pool.end();}
          }
          function encryptReport(report, publicKey) {
            const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv);
            const encrypted=Buffer.concat([cipher.update(JSON.stringify(report),'utf8'),cipher.final()]);
            return JSON.stringify({key:publicEncrypt({key:publicKey,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:encrypted.toString('base64')});
          }
          async function cleanConfirmedTestRecords(publicKey) {
            const pool=new pg.Pool({connectionString:process.env.DATABASE_URL||process.env.APPSETTING_DATABASE_URL,ssl:{rejectUnauthorized:false},connectionTimeoutMillis:15000,max:1});
            const client=await pool.connect();
            const batch='confirmed-test-cleanup-2026-09-10';
            const qaSite='QA BDMS 20260908 9F27B4C1';
            const qaRun='qa-bdms-0908-9f27b4c1';
            const qaRefs=['REQ-1788879757007','REQ-1788881487829','REQ-1788884546051','REQ-1788885282016','REQ-1788885902664','REQ-1788935067770'];
            const demoRefs=['REQ-1788952372626','REQ-1788953643786','REQ-1788961707276'];
            const refs=[...qaRefs,...demoRefs];
            const masterIds=['352959','359061','359062','359063','359064','359065','359066','359067','359068','359069'];
            const ticketRef='TIC/QA-BDMS-20260908-9F27B4C1/080926/000051';
            function ensure(condition,code){if(!condition)throw Object.assign(new Error(code),{code});}
            try {
              await client.query('BEGIN ISOLATION LEVEL SERIALIZABLE');
              await client.query("SET LOCAL statement_timeout='30s'");
              await client.query('SELECT pg_advisory_xact_lock(hashtext($1))',[batch]);
              await client.query('CREATE TABLE IF NOT EXISTS operational_cleanup_archives (batch_id TEXT PRIMARY KEY,encrypted_payload JSONB NOT NULL,summary JSONB NOT NULL,created_at TIMESTAMPTZ NOT NULL DEFAULT NOW())');
              const previous=(await client.query('SELECT summary,encrypted_payload FROM operational_cleanup_archives WHERE batch_id=$1',[batch])).rows[0];
              if(previous){await client.query('COMMIT');return {alreadyApplied:true,...previous.summary,encryptedArchive:previous.encrypted_payload};}
              const requests=(await client.query('SELECT * FROM maintenance_requests WHERE reference=ANY($1::text[]) ORDER BY reference FOR UPDATE',[refs])).rows;
              ensure(requests.length===9,'REQUEST_COUNT_CHANGED');
              ensure(requests.every(row=>qaRefs.includes(row.reference)?row.site===qaSite&&row.requester_login.startsWith(qaRun+'-')&&row.door_number.startsWith('QA-9F27-'):row.site==='Sasti OB'&&row.complaint.trim().toLowerCase()==='demo'&&row.requester_login.toLowerCase()==='stupal'),'REQUEST_IDENTITY_CHANGED');
              const masters=(await client.query('SELECT * FROM master_records WHERE id=ANY($1::bigint[]) ORDER BY id FOR UPDATE',[masterIds])).rows;
              ensure(masters.length===10,'MASTER_COUNT_CHANGED');
              ensure(masters.every(row=>row.master_name==='Users & employees'&&(String(row.id)==='352959'?row.record_data.login==='dummy user'&&row.record_data.employee==='dummy user':row.record_data.qaRun===qaRun&&row.record_data.site===qaSite&&row.record_data.login.startsWith(qaRun+'-'))),'MASTER_IDENTITY_CHANGED');
              const logins=masters.map(row=>row.record_data.login.toLowerCase());
              const related=(await client.query('SELECT reference FROM maintenance_requests WHERE site=$1 OR lower(requester_login)=ANY($2::text[])',[qaSite,logins])).rows;
              ensure(related.every(row=>refs.includes(row.reference)),'UNREVIEWED_REQUEST_LINK');
              const tickets=(await client.query('SELECT * FROM crm_tickets WHERE reference=$1 FOR UPDATE',[ticketRef])).rows;
              ensure(tickets.length===1&&String(tickets[0].id)==='51'&&tickets[0].site===qaSite&&tickets[0].message.startsWith('QA-9F27-TICKET-01'),'TICKET_IDENTITY_CHANGED');
              const linkedTickets=(await client.query('SELECT reference FROM crm_tickets WHERE site=$1 OR lower(creator_login)=ANY($2::text[])',[qaSite,logins])).rows;
              ensure(linkedTickets.every(row=>row.reference===ticketRef),'UNREVIEWED_TICKET_LINK');
              const allRefs=[...refs,ticketRef];
              const selections=[
                ['maintenance_daily_remarks','request_reference=ANY($1::text[])',[refs]],
                ['crm_notifications','ticket_reference=ANY($1::text[]) OR lower(recipient_login)=ANY($2::text[])',[allRefs,logins]],
                ['whatsapp_workflow_dispatches','request_reference=ANY($1::text[]) OR lower(recipient_login)=ANY($2::text[])',[refs,logins]],
                ['whatsapp_consolidated_report_runs','lower(recipient_login)=ANY($1::text[])',[logins]],
                ['dashboard_layout_preferences','lower(login_name)=ANY($1::text[])',[logins]],
                ['admin_lock_incidents','ticket_reference=$1',[ticketRef]],
                ['password_change_sessions','master_record_id=ANY($1::bigint[])',[masterIds]],
                ['password_reset_sessions','master_record_id=ANY($1::bigint[])',[masterIds]],
                ['auth_sessions','lower(login_name)=ANY($1::text[])',[logins]]
              ];
              const archive={batch,capturedAt:new Date().toISOString(),maintenance_requests:requests,master_records:masters,crm_tickets:tickets};
              for(const [table,where,values] of selections)archive[table]=(await client.query(`SELECT * FROM ${table} WHERE ${where} FOR UPDATE`,values)).rows;
              const summary={batch,removedCases:requests.length,removedAccounts:masters.length,removedTickets:tickets.length,relatedCounts:Object.fromEntries(selections.map(([table])=>[table,archive[table].length]))};
              const encryptedArchive=JSON.parse(encryptReport(archive,publicKey));
              await client.query('INSERT INTO operational_cleanup_archives(batch_id,encrypted_payload,summary) VALUES ($1,$2::jsonb,$3::jsonb)',[batch,JSON.stringify(encryptedArchive),JSON.stringify(summary)]);
              for(const [table,where,values] of selections){const deleted=await client.query(`DELETE FROM ${table} WHERE ${where}`,values);ensure(deleted.rowCount===archive[table].length,'RELATED_COUNT_CHANGED');}
              ensure((await client.query('DELETE FROM maintenance_requests WHERE reference=ANY($1::text[])',[refs])).rowCount===9,'REQUEST_DELETE_COUNT');
              ensure((await client.query('DELETE FROM crm_tickets WHERE reference=$1',[ticketRef])).rowCount===1,'TICKET_DELETE_COUNT');
              ensure((await client.query('DELETE FROM master_records WHERE id=ANY($1::bigint[])',[masterIds])).rowCount===10,'MASTER_DELETE_COUNT');
              ensure((await client.query('SELECT 1 FROM maintenance_requests WHERE site=$1 OR reference=ANY($2::text[])',[qaSite,refs])).rowCount===0,'REQUESTS_REMAIN');
              ensure((await client.query("SELECT 1 FROM master_records WHERE record_data->>'qaRun'=$1 OR lower(record_data->>'login')=ANY($2::text[])",[qaRun,logins])).rowCount===0,'MASTERS_REMAIN');
              await client.query("INSERT INTO audit_events(event_type,outcome,actor_login,actor_name,actor_role,module,action,target_type,target_reference,reason,changed_fields) VALUES ('Data cleanup','Success','codex-maintenance','Codex - user-requested cleanup','Maintenance operation','System Administration','Archive and remove confirmed test records','Cleanup batch',$1,$2,$3::jsonb)",[batch,'User requested removal of dummy/test locations and records. Exact identities reviewed; encrypted recovery archive retained. Existing audit and login history preserved.',JSON.stringify(Object.entries(summary).filter(([field])=>field!=='relatedCounts').map(([field,value])=>({field,value:String(value)})))]);
              await client.query('COMMIT');
              return {...summary,encryptedArchive};
            } catch(error){await client.query('ROLLBACK');throw error;}
            finally {client.release();await pool.end();}
          }
          try {
            const credentials=JSON.parse(execFileSync('az',['webapp','deployment','list-publishing-credentials','--resource-group','coalmine-fleet-maintenance-rg','--name','coalmine-fleet-azure-783','-o','json'],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            const scm=new URL(credentials.scmUri).origin;
            const source=["import pg from 'pg';", "import {createCipheriv,publicEncrypt,randomBytes} from 'node:crypto';",inspectDatabase.toString(),encryptReport.toString(),cleanConfirmedTestRecords.toString(),`cleanConfirmedTestRecords(${JSON.stringify(publicKey)}).then(async cleanup=>({cleanup,...await inspectDatabase()})).then(report=>console.log(encryptReport(report,${JSON.stringify(publicKey)}))).catch(error=>{console.error('Remote cleanup or verification failed ('+(error.code||error.name)+')');process.exitCode=1;});`].join('\n');
            const bundle=await build({stdin:{contents:source,resolveDir:process.cwd()},bundle:true,platform:'node',format:'cjs',target:'node16',external:['pg-native'],write:false,minify:true});
            const auth={Authorization:'Basic '+Buffer.from(credentials.publishingUserName+':'+credentials.publishingPassword).toString('base64')};
            const scriptPath='/api/vfs/data/qa-location-inspection.cjs';
            const upload=await fetch(scm+scriptPath,{method:'PUT',headers:{...auth,'If-Match':'*','Content-Type':'application/octet-stream'},body:bundle.outputFiles[0].text});
            if(!upload.ok)throw Object.assign(new Error('Inspection upload failed'),{code:`UPLOAD_${upload.status}`});
            const response=await fetch(scm+'/api/command',{method:'POST',headers:{...auth,'Content-Type':'application/json'},body:JSON.stringify({command:'node /home/data/qa-location-inspection.cjs',dir:'/home/site/wwwroot'}),signal:AbortSignal.timeout(180000)});
            await fetch(scm+scriptPath,{method:'DELETE',headers:{...auth,'If-Match':'*'}});
            if(!response.ok)throw Object.assign(new Error('Remote command failed'),{code:`HTTP_${response.status}`});
            const result=await response.json();
            if(result.ExitCode!==0)throw Object.assign(new Error('Remote inspection failed'),{code:'REMOTE_'+String(result.Error||'FAILED').replace(/[^A-Za-z0-9_(). -]/g,'').slice(0,120)});
            const encrypted=JSON.parse(result.Output.trim());
            if(!encrypted.key||!encrypted.data||!encrypted.tag)throw new Error('Encrypted report unavailable');
            writeFileSync('qa-site-report.enc.json',JSON.stringify(encrypted));
            console.log('Confirmed test-record cleanup and location verification completed. Encrypted recovery report prepared.');
          } catch(error) { console.error(`Inspection failed (${error.code || error.name || 'unknown'}). No production data printed.`);process.exitCode=1; }
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: qa-site-inspection-${{ github.run_id }}
          path: qa-site-report.enc.json
          retention-days: 3
      - if: always()
        run: az logout
